name: Deploy Remote

# Deploys the /remote relay (apps/remote) to Cloudflare. Pushes to main deploy
# only when something that ships changes: the Worker, the web app, their
# dependencies, or the wire protocol the relay imports from packages/remote.
# Tests and docs are excluded; run it by hand to redeploy without a change.
#
# Required:
#   secret  CLOUDFLARE_API_TOKEN  "Edit Cloudflare Workers" template plus D1: Edit,
#                                 scoped to the account and the knightcode.dev zone

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-remote.yml"
      - "apps/remote/**"
      - "!apps/remote/**/*.md"
      - "!apps/remote/test/**"
      - "!apps/remote/web/test/**"
      - "!apps/remote/**/vitest.config.ts"
      - "packages/remote/src/protocol.ts"
  workflow_dispatch:

# Queue rather than cancel: a deploy cut off between the migration and the
# upload would leave the schema ahead of the running Worker.
concurrency:
  group: deploy-remote
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/remote
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before the upload, so new code never runs against the old schema.
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply knightcode-remote --remote

      # Builds web/dist first; a bare `wrangler deploy` would upload no app.
      - name: Deploy
        run: bun run deploy
