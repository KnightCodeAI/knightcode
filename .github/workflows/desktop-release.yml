name: desktop-release

# The desktop app's release (apps/desktop/docs/desktop-app/desktop-shell.md
# section 15): build the installers on each platform from main at the version
# changesets gave apps/desktop, smoke-test each packaged app, then tag it
# desktop-v<version> and leave a draft GitHub Release with every artifact,
# SHA256SUMS, and the changelog since the last published desktop release for the
# owner to publish. The version moves only through a @knightcode/desktop
# changeset and the Version Packages PR (publish.yml). A failed build leaves no
# tag, so the same version runs again. The update feed on knightcode.dev
# (apps/web/app/api/desktop/update) offers only published releases, and shows
# their notes as what's new.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the draft as a prerelease (the update feed skips prereleases)
        type: boolean
        default: false

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the releases for the notes
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Read the version and its notes
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          tag="desktop-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists. Add a @knightcode/desktop changeset and merge the Version Packages PR that bumps apps/desktop."
            exit 1
          fi
          # The notes cover everything since the newest desktop release users could install.
          since=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName | select(startswith("desktop-v")) | ltrimstr("desktop-v")' \
            | sort -V | tail -n 1)
          notes=$(bun run scripts/desktop-release-notes.ts "$version" "$since")
          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "version=${version}"
            echo "sha=$(git rev-parse HEAD)"
            echo "notes<<${delimiter}"
            printf '%s\n' "$notes"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: win32-x64
            runner: windows-2022
            platform: win32
            arch: x64
            smoke: true
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            smoke: true
          # Cross-built on Apple silicon: no free Intel runner to start it on.
          - target: darwin-x64
            runner: macos-15
            platform: darwin
            arch: x64
            smoke: false
          - target: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            smoke: true
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The version job's commit: this run's GITHUB_SHA is the one before the bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # rpmbuild for the rpm maker; node-pty builds with node-gyp on Linux, which has no prebuild.
      - name: Install system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb

      - run: bun install --frozen-lockfile

      - name: Hydrate model data
        run: bun run hydrate:model-data

      - name: Check the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          packaged=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          if [ "$packaged" != "$VERSION" ]; then
            echo "::error::apps/desktop is ${packaged}, the tag is desktop-v${VERSION}"
            exit 1
          fi

      - name: Stage the app server
        run: bun run apps/desktop/scripts/stage-server.ts --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      # The dmg maker's native modules build in their install scripts, which Bun runs only for
      # trusted packages; built here instead, as forge.config.ts copies Squirrel's 7-Zip.
      - name: Build the dmg maker's native modules
        if: matrix.platform == 'darwin'
        run: |
          for module in macos-alias fs-xattr; do
            (cd "node_modules/$module" && npx --yes node-gyp@11.5.0 rebuild)
          done

      - name: Make
        working-directory: apps/desktop
        run: |
          bun scripts/link-electron.ts
          bun x electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      # Ad hoc signed until a Developer ID exists (forge.config.ts); a broken
      # signature would only surface as Gatekeeper's "damaged" on a user's Mac.
      - name: Verify the signature
        if: matrix.platform == 'darwin'
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/out/KnightCode-darwin-${{ matrix.arch }}/KnightCode.app"

      # The packaged app with its bundled server: exits 0 once the server
      # answers initialize and the window's page reaches main (src/main.ts).
      - name: Smoke test
        if: matrix.smoke
        timeout-minutes: 3
        working-directory: apps/desktop/out
        env:
          KNIGHTCODE_DESKTOP_SMOKE: "1"
        run: |
          data="$RUNNER_TEMP/kc-smoke"
          export KNIGHTCODE_CODING_AGENT_DIR="$RUNNER_TEMP/kc-agent"
          case "${{ matrix.platform }}" in
            win32) ./KnightCode-win32-x64/knightcode-desktop.exe "--user-data-dir=$data" ;;
            darwin) "./KnightCode-darwin-${{ matrix.arch }}/KnightCode.app/Contents/MacOS/knightcode-desktop" "--user-data-dir=$data" ;;
            # The SUID sandbox helper is not set up on a runner.
            linux) xvfb-run -a ./KnightCode-linux-x64/knightcode-desktop --no-sandbox "--user-data-dir=$data" ;;
          esac

      # A real shell through node-pty: macOS's only CI run of it (ci.yml covers Windows and Linux).
      - name: Real PTY test
        if: matrix.target == 'darwin-arm64'
        working-directory: apps/desktop
        env:
          KNIGHTCODE_REAL_PTY: "1"
        run: bun x vitest --run test/main/real-pty.test.ts

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/out/make/
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag the commit and create the draft release
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: desktop-*

      # Squirrel's RELEASES keeps its name: the update feed looks it up by name.
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir assets
          find artifacts -type f \( -name RELEASES -o -name '*.nupkg' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} assets/ \;
          cd assets
          # GitHub stores "KnightCode-1.0.0 Setup.exe" as "KnightCode-1.0.0.Setup.exe"; SHA256SUMS names what it serves.
          for file in *\ *; do [ -e "$file" ] && mv -- "$file" "${file// /.}"; done
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          sha256sum -c SHA256SUMS
          ls -la

      # A draft, never marked latest: the repository's latest release is the
      # CLI's, which its installer and GitHub's /releases/latest look up.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          NOTES: ${{ needs.version.outputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="desktop-v${VERSION}"
          # What changed, then how to install it.
          printf '%s\n\n---\n\n%s\n' "$NOTES" "Windows: run the Setup.exe. macOS: open the .dmg for your Mac (Apple silicon arm64, Intel x64). Linux: the .deb or .rpm. Check downloads against SHA256SUMS. Install notes: https://knightcode.dev/docs" > notes.md
          # Only now that every build passed.
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/${tag}" -f sha="$SHA" >/dev/null
          flags=(--draft --latest=false --target "$SHA" --title "KnightCode desktop ${VERSION}")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # A failed create or upload must not leave the tag, which would block running this version again.
          if ! gh release create "$tag" --repo "${{ github.repository }}" "${flags[@]}" --notes-file notes.md assets/*; then
            gh release delete "$tag" --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${tag}" || true
            exit 1
          fi
