name: desktop-release

# The desktop app's release (apps/desktop/docs/desktop-app/desktop-shell.md
# section 15): bump apps/desktop's version on main, build the installers on each
# platform from that commit, smoke-test each packaged app, then tag it
# desktop-v<version> and leave a draft GitHub Release with every artifact and
# SHA256SUMS for the owner to publish. A failed build leaves no tag, so the same
# version runs again with bump "current". The update feed on knightcode.dev
# (apps/web/app/api/desktop/update) offers only published releases.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to move apps/desktop's version ("current" tags it as it is)
        type: choice
        options: [patch, minor, major, current]
        default: patch
      prerelease:
        description: Mark the draft as a prerelease (the update feed skips prereleases)
        type: boolean
        default: false

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the bump to main
    env:
      HUSKY: 0
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Bump and commit
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          version=$(bun -e '
            const fs = require("node:fs");
            const path = "apps/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            const [major, minor, patch] = pkg.version.split(".").map(Number);
            const bump = process.env.BUMP;
            if (bump !== "current") {
              pkg.version = bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`;
              fs.writeFileSync(path, JSON.stringify(pkg, null, "\t") + "\n");
            }
            console.log(pkg.version);
          ')
          tag="desktop-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMP" != "current" ]; then
            # bun.lock records each workspace's version.
            bun install --lockfile-only
            git add apps/desktop/package.json bun.lock
            git commit -m "Release desktop v${version}"
            git push origin HEAD:main
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: win32-x64
            runner: windows-2022
            platform: win32
            arch: x64
            smoke: true
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            smoke: true
          # Cross-built on Apple silicon: no free Intel runner to start it on.
          - target: darwin-x64
            runner: macos-15
            platform: darwin
            arch: x64
            smoke: false
          - target: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            smoke: true
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The version job's commit: this run's GITHUB_SHA is the one before the bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # rpmbuild for the rpm maker; node-pty builds with node-gyp on Linux, which has no prebuild.
      - name: Install system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb

      - run: bun install --frozen-lockfile

      - name: Hydrate model data
        run: bun run hydrate:model-data

      - name: Check the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          packaged=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          if [ "$packaged" != "$VERSION" ]; then
            echo "::error::apps/desktop is ${packaged}, the tag is desktop-v${VERSION}"
            exit 1
          fi

      - name: Stage the app server
        run: bun run apps/desktop/scripts/stage-server.ts --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Make
        working-directory: apps/desktop
        run: |
          bun scripts/link-electron.ts
          bun x electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      # Ad hoc signed until a Developer ID exists (forge.config.ts); a broken
      # signature would only surface as Gatekeeper's "damaged" on a user's Mac.
      - name: Verify the signature
        if: matrix.platform == 'darwin'
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/out/KnightCode-darwin-${{ matrix.arch }}/KnightCode.app"

      # The packaged app with its bundled server: exits 0 once the server
      # answers initialize and the window's page reaches main (src/main.ts).
      - name: Smoke test
        if: matrix.smoke
        working-directory: apps/desktop/out
        env:
          KNIGHTCODE_DESKTOP_SMOKE: "1"
        run: |
          data="$RUNNER_TEMP/kc-smoke"
          export KNIGHTCODE_CODING_AGENT_DIR="$RUNNER_TEMP/kc-agent"
          case "${{ matrix.platform }}" in
            win32) ./KnightCode-win32-x64/knightcode-desktop.exe "--user-data-dir=$data" ;;
            darwin) "./KnightCode-darwin-${{ matrix.arch }}/KnightCode.app/Contents/MacOS/knightcode-desktop" "--user-data-dir=$data" ;;
            # The SUID sandbox helper is not set up on a runner.
            linux) xvfb-run -a ./KnightCode-linux-x64/knightcode-desktop --no-sandbox "--user-data-dir=$data" ;;
          esac

      # A real shell through node-pty: macOS's only CI run of it (ci.yml covers Windows and Linux).
      - name: Real PTY test
        if: matrix.target == 'darwin-arm64'
        working-directory: apps/desktop
        env:
          KNIGHTCODE_REAL_PTY: "1"
        run: bun x vitest --run test/main/real-pty.test.ts

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/out/make/
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag the commit and create the draft release
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: desktop-*

      # Squirrel's RELEASES keeps its name: the update feed looks it up by name.
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir assets
          find artifacts -type f \( -name RELEASES -o -name '*.nupkg' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} assets/ \;
          cd assets
          # GitHub stores "KnightCode-1.0.0 Setup.exe" as "KnightCode-1.0.0.Setup.exe"; SHA256SUMS names what it serves.
          for file in *\ *; do [ -e "$file" ] && mv -- "$file" "${file// /.}"; done
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          sha256sum -c SHA256SUMS
          ls -la

      # A draft, never marked latest: the repository's latest release is the
      # CLI's, which its installer and GitHub's /releases/latest look up.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="desktop-v${VERSION}"
          # Only now that every build passed.
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/${tag}" -f sha="$SHA" >/dev/null
          flags=(--draft --latest=false --target "$SHA" --title "KnightCode desktop ${VERSION}")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # A failed create or upload must not leave the tag, which would block running this version again.
          if ! gh release create "$tag" --repo "${{ github.repository }}" "${flags[@]}" \
            --notes "Windows: run the Setup.exe. macOS: open the .dmg for your Mac (Apple silicon arm64, Intel x64). Linux: the .deb or .rpm. Check downloads against SHA256SUMS. Install notes: https://knightcode.dev/docs" \
            assets/*; then
            gh release delete "$tag" --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${tag}" || true
            exit 1
          fi
