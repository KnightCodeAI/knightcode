name: desktop-trial-builds

# Throwaway: the release workflow's build job and CI's desktop job on a trial branch, before either runs from main.
# Uploads the installers as artifacts; commits, tags and releases nothing.

on:
  push:
    branches: [trial/desktop-builds]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2022
            platform: win32
            arch: x64
            smoke: true
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            smoke: true
          # Cross-built on Apple silicon: no free Intel runner to start it on.
          - target: darwin-x64
            runner: macos-15
            platform: darwin
            arch: x64
            smoke: false
          - target: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            smoke: true
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The version job's commit: this run's GITHUB_SHA is the one before the bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # rpmbuild for the rpm maker; node-pty builds with node-gyp on Linux, which has no prebuild.
      - name: Install system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb

      - run: bun install --frozen-lockfile

      - name: Hydrate model data
        run: bun run hydrate:model-data

      - name: Check the version
        run: |
          VERSION=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          packaged=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          if [ "$packaged" != "$VERSION" ]; then
            echo "::error::apps/desktop is ${packaged}, the tag is desktop-v${VERSION}"
            exit 1
          fi

      - name: Stage the app server
        run: bun run apps/desktop/scripts/stage-server.ts --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      # The dmg maker's native modules build in their install scripts, which Bun runs only for
      # trusted packages; built here instead, as forge.config.ts copies Squirrel's 7-Zip.
      - name: Build the dmg maker's native modules
        if: matrix.platform == 'darwin'
        run: |
          for module in macos-alias fs-xattr; do
            (cd "node_modules/$module" && npx --yes node-gyp@11.5.0 rebuild)
          done

      - name: Make
        working-directory: apps/desktop
        run: |
          bun scripts/link-electron.ts
          bun x electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      # Ad hoc signed until a Developer ID exists (forge.config.ts); a broken
      # signature would only surface as Gatekeeper's "damaged" on a user's Mac.
      - name: Trial check, the packaged spawn-helper is executable
        if: matrix.platform == 'darwin'
        run: |
          helper=$(find apps/desktop/out -path '*app.asar.unpacked/node_modules/node-pty/prebuilds/*/spawn-helper' | head -1)
          ls -l "$helper"
          test -x "$helper"

      - name: Verify the signature
        if: matrix.platform == 'darwin'
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/out/KnightCode-darwin-${{ matrix.arch }}/KnightCode.app"

      # The packaged app with its bundled server: exits 0 once the server
      # answers initialize and the window's page reaches main (src/main.ts).
      - name: Smoke test
        if: matrix.smoke
        timeout-minutes: 3
        working-directory: apps/desktop/out
        env:
          KNIGHTCODE_DESKTOP_SMOKE: "1"
        run: |
          data="$RUNNER_TEMP/kc-smoke"
          export KNIGHTCODE_CODING_AGENT_DIR="$RUNNER_TEMP/kc-agent"
          case "${{ matrix.platform }}" in
            win32) ./KnightCode-win32-x64/knightcode-desktop.exe "--user-data-dir=$data" ;;
            darwin) "./KnightCode-darwin-${{ matrix.arch }}/KnightCode.app/Contents/MacOS/knightcode-desktop" "--user-data-dir=$data" ;;
            # The SUID sandbox helper is not set up on a runner.
            linux) xvfb-run -a ./KnightCode-linux-x64/knightcode-desktop --no-sandbox "--user-data-dir=$data" ;;
          esac

      # A real shell through node-pty: macOS's only CI run of it (ci.yml covers Windows and Linux).
      - name: Real PTY test
        if: matrix.target == 'darwin-arm64'
        working-directory: apps/desktop
        env:
          KNIGHTCODE_REAL_PTY: "1"
        run: bun x vitest --run test/main/real-pty.test.ts

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/out/make/
          if-no-files-found: error
          retention-days: 3


  install-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-darwin-arm64
          path: new
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-darwin-arm64
          path: old
          run-id: 39988126130
          github-token: ${{ github.token }}
      - name: Install each build from its dmg and start it
        env:
          KNIGHTCODE_DESKTOP_SMOKE: "1"
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          sw_vers
          n=0
          # The new build on a clean machine first, then the old one at the same path, then the new one again.
          for build in new old new; do
            n=$((n + 1))
            dmg=$(find "$build" -name '*.dmg' | head -1)
            mount=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
            rm -rf /Applications/KnightCode.app
            cp -R "$mount/KnightCode.app" /Applications/
            hdiutil detach "$mount" >/dev/null
            echo "== $n $build $(codesign -dv /Applications/KnightCode.app 2>&1 | grep -E '^CodeDirectory')"
            log="$RUNNER_TEMP/$n-$build.log"
            started=$(date '+%Y-%m-%d %H:%M:%S')
            KNIGHTCODE_CODING_AGENT_DIR="$RUNNER_TEMP/agent-$n" /Applications/KnightCode.app/Contents/MacOS/knightcode-desktop "--user-data-dir=$RUNNER_TEMP/data-$n" > "$log" 2>&1 &
            pid=$!
            for i in $(seq 90); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then
              echo "== $n $build HUNG after 90 s"
              ps -axo pid,ppid,stat,etime,command | grep -i -E "knightcode|KnightCode" | grep -v grep | cut -c1-220
              sample "$pid" 2 -file "$RUNNER_TEMP/$n-sample.txt" >/dev/null 2>&1 || true
              head -60 "$RUNNER_TEMP/$n-sample.txt" 2>/dev/null || true
              log show --start "$started" --style compact --predicate 'process == "knightcode-desktop" OR process == "amfid" OR process == "syspolicyd" OR eventMessage CONTAINS[c] "knightcode"' 2>/dev/null | tail -40 || true
              pkill -9 -f "KnightCode.app" || true
              code=hung
            else
              wait "$pid"; code=$?
            fi
            echo "-- log tail"; tail -25 "$log" | cut -c1-240
            echo "== $n $build exit $code"
            echo "$n-$build=$code" >> "$RUNNER_TEMP/codes"
          done
          cat "$RUNNER_TEMP/codes"
          grep -q '^1-new=0$' "$RUNNER_TEMP/codes"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # node-pty builds with node-gyp on Linux, which has no prebuild.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hydrate model data
        run: bun run hydrate:model-data

      - name: Check types
        working-directory: apps/desktop
        run: bun run check-types

      # With one real shell through node-pty (test/main/real-pty.test.ts); the
      # release workflow runs it on macOS.
      - name: Test
        working-directory: apps/desktop
        env:
          KNIGHTCODE_REAL_PTY: "1"
        run: bun run test

      # The end-to-end tests launch the production Vite build that packaging
      # leaves in apps/desktop/.vite, against a faux-model app server.
      - name: Package
        run: |
          bun run apps/desktop/scripts/stage-server.ts
          cd apps/desktop && bun run package

      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end tests
        working-directory: apps/desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a bun run test:e2e; else bun run test:e2e; fi

      - name: Upload the end-to-end traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-${{ matrix.runner }}
          path: apps/desktop/test-results/
          retention-days: 7
