name: publish

on:
  push:
    branches:
      - main
    # Only run when something publishable changed — pushes touching only
    # apps/** (e.g. the website) skip the workflow entirely. Version-Packages
    # merges still match via .changeset/** and packages/*/package.json.
    paths:
      - "packages/**"
      - ".changeset/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/publish.yml"

# No cancel-in-progress on purpose: cancelling a run mid-publish could leave a
# partial release (some of the 6 fixed-group packages published, others not).
# Queue overlapping runs instead of cancelling them.
concurrency: ${{ github.workflow }}-${{ github.ref }}

# Deny by default; every job below re-grants exactly what it needs.
permissions: {}

jobs:
  # Manages the "Version Packages" PR on every push. When changesets are present
  # it opens/updates the PR and stops. The build + publish jobs below only run
  # when there are no changesets left AND the version in the repo is not yet on
  # npm — i.e. exactly once, on the Version Packages merge. Without the registry
  # check, every ordinary merge (no changesets) would spin up the full 5-OS
  # build matrix just to no-op at `changeset publish`.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit + push the Version PR branch
      pull-requests: write # open/update the Version Packages PR
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      needsPublish: ${{ steps.release.outputs.needsPublish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - run: bun install

      # All 6 fixed-group packages must be checked, not just the main one: a
      # release run that fails partway can leave some platform packages
      # unpublished, and a re-run must still fire for the stragglers. Keep the
      # list in sync with the fixed group in .changeset/config.json. The empty
      # check alongside the exit code covers old npm versions where a missing
      # version exited 0 with no output.
      - name: Check whether the current version is unpublished
        id: release
        shell: bash
        run: |
          local_ver=$(node -p "require('./packages/cli/package.json').version")
          needs_publish=false
          for pkg in @knightcodeai/cli @knightcodeai/cli-linux-x64 @knightcodeai/cli-linux-arm64 @knightcodeai/cli-darwin-x64 @knightcodeai/cli-darwin-arm64 @knightcodeai/cli-win32-x64; do
            if [ -z "$(npm view "${pkg}@${local_ver}" version 2>/dev/null)" ]; then
              needs_publish=true
              break
            fi
          done
          echo "needsPublish=${needs_publish}" >> "$GITHUB_OUTPUT"
          echo "local=$local_ver needsPublish=$needs_publish"

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: bun run ci:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build each binary on its own native OS and run it headlessly before it goes
  # anywhere near npm — a compiled binary that cannot start is the one failure
  # `npm pack` can never catch. Only darwin-x64 has no free native runner
  # (GitHub retired the Intel image); it is cross-compiled on the arm64 mac and
  # skips the smoke test, since macOS runners ship without Rosetta.
  build:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false' && needs.version.outputs.needsPublish == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            smoke: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm # free native arm64 runner (public repo)
            smoke: true
          - target: darwin-x64
            runner: macos-latest
            smoke: false # cross-compiled from arm64 — no free Intel runner, no Rosetta
          - target: darwin-arm64
            runner: macos-latest
            smoke: true
          - target: win32-x64
            runner: windows-latest
            smoke: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false # build job never pushes; don't leave the token in .git/config

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - run: bun install

      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        shell: bash # windows-latest defaults to pwsh, where "$TARGET" wouldn't expand
        run: bun run scripts/build.ts --target="$TARGET"

      - name: Smoke test (native targets only)
        if: matrix.smoke
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          bin="packages/cli-${TARGET}/bin/knightcode"
          if [ "$TARGET" = "win32-x64" ]; then bin="$bin.exe"; fi
          echo "→ knightcode --version"
          "$bin" --version
          # --help, not an invented subcommand: unrecognised argv is treated as a
          # prompt and sent to the provider, so a bad smoke command would either
          # hang on a missing API key or quietly bill a real request.
          echo "→ knightcode --help"
          "$bin" --help | grep -q "Usage:"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: packages/cli-${{ matrix.target }}/bin/
          if-no-files-found: error
          retention-days: 1

  # Reassemble the tested binaries into their package folders, validate the full
  # npm install path (pack-test), then publish every package Changesets considers
  # unpublished. Publishes the exact artifacts the build job produced.
  publish:
    needs: [version, build]
    if: needs.version.outputs.hasChangesets == 'false' && needs.version.outputs.needsPublish == 'true'
    runs-on: ubuntu-latest
    # GitHub creates this environment on first use. Add required reviewers to it
    # to hold releases for approval, and scope NPM_TOKEN to it.
    environment: npm-publish
    permissions:
      contents: write # push tags + create the GitHub Release
      id-token: write # npm publish --provenance (OIDC); without it publish fails
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false # tags are pushed with an explicit token below

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # Node 24, not 20: the test suite spawns the CLI as `node src/cli.ts`, which
      # needs the type stripping Node ships unflagged from 22.18 on. Node 20 put
      # ERR_UNKNOWN_FILE_EXTENSION under every spawning test and failed a release.
      # Keep this at the version CI tests on (the ubuntu-latest default).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Same reason as ci.yml: packages/cli/src/core/tools/{grep,find}.ts shell
      # out to ripgrep and fd. Keep in sync with the CI job.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - run: bun install

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Restore binaries into platform packages
        shell: bash
        run: |
          for dir in artifacts/cli-*; do
            target="${dir##*/cli-}"
            dest="packages/cli-${target}/bin"
            mkdir -p "$dest"
            cp -r "${dir}/." "$dest/"
          done
          # Artifact upload drops the mode bit; npm pack/publish reads it from
          # disk, so re-mark the POSIX binaries (not knightcode.exe) executable.
          chmod +x packages/cli-*/bin/knightcode 2>/dev/null || true
          ls -la packages/cli-*/bin

      - name: pack-test + publish
        run: bun run ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" --tags

      # Ship the same binaries npm got as downloadable release assets, with
      # checksums, so `curl | tar` is a supported install path and anyone can
      # verify what they downloaded. Each archive is the whole bin/ directory:
      # the compiled binary resolves themes, assets and docs next to itself.
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for dir in packages/cli-*/bin; do
            target="${dir#packages/cli-}"
            target="${target%/bin}"
            if [ "$target" = "win32-x64" ]; then
              (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/release-assets/knightcode-${target}.zip" .)
            else
              tar -czf "release-assets/knightcode-${target}.tar.gz" -C "$dir" .
            fi
          done
          cd release-assets
          # One archive per platform package, or the release is missing a binary
          # someone will only discover after it is public.
          count=$(ls -1 knightcode-* | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 platform archives, packaged ${count}"
            ls -la
            exit 1
          fi
          # Glob the archives explicitly: `*` would race SHA256SUMS into its own
          # checksum list and `sha256sum -c` would then fail on it.
          sha256sum knightcode-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -la

      # One clean GitHub Release per version for the main package (not the 5
      # platform packages). Body = the CHANGELOG.md section Changesets wrote.
      # Idempotent: skips if the release already exists (re-runs / no-op pushes).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          tag="@knightcodeai/cli@${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release for $tag already exists — nothing to do."
            exit 0
          fi
          notes=$(awk -v ver="$version" '
            $0 == "## " ver { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' packages/cli/CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="Release ${version}."
          fi
          printf '%s\n' "$notes" | gh release create "$tag" \
            --title "v${version}" \
            --notes-file - \
            release-assets/*
