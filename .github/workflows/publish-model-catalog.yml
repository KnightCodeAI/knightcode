name: Publish Model Catalog

# Port of pi's publish-model-catalog.yml. Regenerates the model catalog from
# models.dev and uploads it to R2, so clients pick up new models without waiting
# for a release (see packages/cli/src/core/remote-catalog-provider.ts).
#
# Required to actually publish (the generate job runs without them):
#   secrets   KNIGHTCODE_ARTIFACTS_R2_ACCESS_KEY_ID
#             KNIGHTCODE_ARTIFACTS_R2_SECRET_ACCESS_KEY
#   variable  R2_ENDPOINT   https://<account-id>.r2.cloudflarestorage.com
#   env       knightcode-model-upload   (gates the publish job on approval)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-model-catalog.yml"
      - "package.json"
      - "packages/ai/**"
      - "scripts/publish-model-catalog.mjs"
  pull_request:
    paths:
      - ".github/workflows/publish-model-catalog.yml"
      - "package.json"
      - "packages/ai/**"
      - "scripts/publish-model-catalog.mjs"
  # Cron is UTC. Run hourly candidates across the CET/CEST boundary; the publish
  # job itself only uploads inside the business-hours window checked below, so a
  # bad catalog lands when someone is around to roll it back.
  schedule:
    - cron: "17 8-13 * * 1-5"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit, branch, or tag to generate from"
        required: false
        default: "main"
        type: string
      publish:
        description: "Upload the generated catalog to production R2"
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - run: bun install

      # Network only, no API keys: generate-models.ts reads models.dev.
      - name: Generate model catalog JSON
        run: bun run generate:model-catalog

      # Same validation the uploader runs, so a bad catalog fails here rather
      # than after the R2 credentials are in scope.
      - name: Validate model catalog JSON
        run: bun run check:model-catalog

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-catalog-json
          path: .artifacts/model-catalog
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: generate
    runs-on: ubuntu-latest
    environment: knightcode-model-upload
    permissions:
      contents: read
    concurrency:
      group: publish-model-catalog-r2
      cancel-in-progress: true
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.KNIGHTCODE_ARTIFACTS_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.KNIGHTCODE_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: model-catalog-json
          path: .artifacts/model-catalog

      - name: Verify AWS CLI
        run: aws --version

      # Only upload Mon-Fri 10:00-15:00 Europe/Vienna, and on the cron path only
      # at 10:17/12:17/14:17 — a catalog regression should land while someone can
      # repoint index.json at the previous revision.
      - name: Check publication window
        id: publication-window
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail

          local_day="$(TZ=Europe/Vienna date +%u)"
          local_hour_text="$(TZ=Europe/Vienna date +%H)"
          local_hour="$((10#$local_hour_text))"
          local_time="$(TZ=Europe/Vienna date '+%Y-%m-%d %H:%M:%S %Z')"
          allowed=false
          reason="outside the Monday-Friday 10:00-15:00 Europe/Vienna publication window"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ]]; then
            allowed=true
            reason="manual publication"
          elif (( local_day <= 5 && local_hour >= 10 && local_hour < 15 )); then
            if [[ "$EVENT_NAME" != "schedule" ]] || (( (local_hour - 10) % 2 == 0 )); then
              allowed=true
              reason="business-hours publication"
            else
              reason="not a scheduled 10:17, 12:17, or 14:17 Europe/Vienna publication"
            fi
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "R2 publication allowed: $allowed ($reason; local time: $local_time)"

      - name: Publish model catalog to R2
        if: steps.publication-window.outputs.allowed == 'true'
        run: |
          node scripts/publish-model-catalog.mjs \
            --input .artifacts/model-catalog \
            --bucket knightcode-artifacts \
            --endpoint "$R2_ENDPOINT" \
            --source-commit "$(git rev-parse HEAD)"
