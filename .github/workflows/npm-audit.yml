name: audit

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      # Deliberately the whole workspace, not just production dependencies the
      # way pi's `npm audit --omit=dev` does. Dev dependencies are not inert
      # here: they build the site apps/web deploys, and they are the toolchain
      # that compiles the published binaries. A compromised one reaches a
      # shipped artifact either way, just a different artifact. bun audit
      # resolves the root lockfile, which covers every workspace.
      #
      # bun has no equivalent of `npm audit signatures`, so registry-signature
      # verification is left to the npm publish path (--provenance in
      # ci-publish.ts).
      - name: Audit dependencies
        run: bun audit --audit-level=moderate
