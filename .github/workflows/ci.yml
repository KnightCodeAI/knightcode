name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # packages/cli/src/core/tools/{grep,find}.ts shell out to ripgrep and fd.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The provider catalog is generated from the live catalog sources rather than
      # committed, so nothing type-checks, tests or builds until it is hydrated.
      - name: Hydrate model data
        run: bun run hydrate:model-data

      - name: Check formatting
        run: bun run format:check

      - name: Check types
        run: bun run check-types

      # Bundles durable's public entry points for the browser and fails if the
      # Node SQLite adapter (or any Node built-in) leaks into them.
      - name: Check browser-safe exports
        run: bun run check:browser-smoke

      # Self-checks the release-time regrouping, which is otherwise exercised
      # only during a release, then checks the category verb on every pending
      # changeset — the release log's warning would come far too late.
      - name: Check changesets
        run: bun run scripts/changelog-sections.ts

      # The env package's tests talk to its Rust daemon over a pipe.
      - name: Build the env daemon
        run: bun run --filter '@knightcode/env' build:daemon

      # The env SSH bootstrap tests start a disposable sshd on localhost and skip without one.
      - name: Install an SSH server for the env bootstrap tests
        run: command -v sshd || test -x /usr/sbin/sshd || (sudo apt-get update && sudo apt-get install -y openssh-server)

      - name: Test
        run: bun run test

      # Both builds are part of the release path; break here rather than in the
      # publish workflow, where a failure blocks an in-flight release.
      # pack-test builds the Node bundle npm ships and runs it from an install,
      # on the oldest Node the package supports (engines in packages/cli) rather
      # than whatever the runner image ships, and on an unsupported Node, which
      # must get the launcher's version message rather than a crash.
      - name: Setup Node (unsupported)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2

      - name: Record the unsupported Node for pack-test
        run: echo "KNIGHTCODE_PACK_TEST_OLD_NODE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node (minimum supported)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0

      - name: Build and pack-test the Node bundle
        run: bun run scripts/pack-test.ts

      - name: Build binary
        run: bun run build:binary

      # --help, not an invented subcommand: unrecognised argv is treated as a
      # prompt and sent to the provider, which needs an API key CI does not have.
      - name: Smoke test binary
        run: |
          dist/release/linux-x64/knightcode --version
          dist/release/linux-x64/knightcode --help | grep -q "Usage:"

  mcp-conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hydrate model data
        run: bun run hydrate:model-data

      # Runs the MCP client from source against the pinned official conformance suite (fetched
      # with npx) and fails on regressions against packages/cli/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: bun run test:mcp-conformance

  # apps/ is outside the root type check and test run (separate toolchains).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # node-pty builds with node-gyp on Linux, which has no prebuild.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hydrate model data
        run: bun run hydrate:model-data

      - name: Check types
        working-directory: apps/desktop
        run: bun run check-types

      # With one real shell through node-pty (test/main/real-pty.test.ts); the
      # release workflow runs it on macOS.
      - name: Test
        working-directory: apps/desktop
        env:
          KNIGHTCODE_REAL_PTY: "1"
        run: bun run test

      # The end-to-end tests launch the production Vite build that packaging
      # leaves in apps/desktop/.vite, against a faux-model app server.
      - name: Package
        run: |
          bun run apps/desktop/scripts/stage-server.ts
          cd apps/desktop && bun run package

      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end tests
        working-directory: apps/desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a bun run test:e2e; else bun run test:e2e; fi

      - name: Upload the end-to-end traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-${{ matrix.runner }}
          path: apps/desktop/test-results/
          retention-days: 7
