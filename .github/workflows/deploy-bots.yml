name: Deploy Bots

# Deploys KnightCode Bots (apps/bots) to Cloudflare: the Worker, its web app and the computer's container image.
# Run by hand only; nothing deploys on push. apps/bots/DEPLOYING.md lists every resource, secret and DNS record that
# has to exist first.
#
# Required:
#   secret  CLOUDFLARE_API_TOKEN  Workers, Containers, D1, R2, Queues, Secrets Store and Email Routing edit rights,
#                                 scoped to the account and the knightcode.dev zone

on:
  workflow_dispatch:

# Queue rather than cancel: a deploy cut off between the migration and the upload would leave the schema ahead of
# the running Worker.
concurrency:
  group: deploy-bots
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/bots
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before the upload, so new code never runs against the old schema.
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply knightcode-bots --env production --remote

      # The Worker serves web/dist; a deploy without it would upload no app.
      - name: Build the web app
        working-directory: apps/bots/web
        run: bun run build

      # Builds and pushes the computer image (computer/Dockerfile) with the Worker.
      - name: Deploy
        run: bunx wrangler deploy --env production
