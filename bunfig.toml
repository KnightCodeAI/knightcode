[install]
# Upstream knightcode is an npm-workspaces monorepo, so its tests assume a hoisted
# node_modules with ONE physical copy of each dependency. Bun's default isolated
# layout gave packages/ai and packages/cli separate copies of `openai`, which
# broke `vi.mock("openai")` in cli tests: the mock applied to cli's copy while
# packages/ai imported its own. Hoisting restores the single-instance assumption.
linker = "hoisted"
