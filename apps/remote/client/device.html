<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Approve a device</title>
		<link rel="stylesheet" href="/glass.css" />
		<style>
			.centred {
				max-width: 24rem;
				margin: 0 auto;
				padding: 15vh 1.5rem 0;
				text-align: center;
			}
			.muted {
				color: var(--text-muted);
			}
			input[name="user_code"] {
				width: 100%;
				margin: 1.5rem 0 1rem;
				padding: 0.75rem 1rem;
				font: inherit;
				font-family: ui-monospace, Menlo, Consolas, monospace;
				font-size: 1.25rem;
				text-align: center;
				letter-spacing: 0.1em;
				background: var(--surface-raised);
				border: 1px solid var(--border);
				border-radius: var(--radius-card);
				color: var(--text);
			}
			button {
				width: 100%;
				padding: 0.7rem;
				border: 0;
				border-radius: 999px;
				background: var(--accent);
				color: white;
				font: inherit;
				font-weight: 590;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main class="centred">
			<h1>Approve a terminal</h1>
			<p class="muted">Enter the code shown in your terminal.</p>
			<form method="post" action="/device">
				<input type="hidden" name="csrf" id="csrf" />
				<input name="user_code" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" required />
				<button type="submit">Approve</button>
			</form>
		</main>
		<script type="module">
			const response = await fetch("/api/csrf");
			const { csrf } = await response.json();
			document.getElementById("csrf").value = csrf;
		</script>
	</body>
</html>
