<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>KnightCode remote</title>
		<link rel="stylesheet" href="/glass.css" />
		<style>
			.centred {
				max-width: 24rem;
				margin: 0 auto;
				padding: 20vh 1.5rem 0;
				text-align: center;
			}
			.muted {
				color: var(--text-muted);
			}
			.button {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.65rem 1.25rem;
				border-radius: 999px;
				background: var(--accent);
				color: white;
				font-weight: 590;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main class="centred">
			<h1>KnightCode remote</h1>
			<p class="muted">Sign in to reach the sessions running on your machines.</p>
			<a class="button" href="/login">Continue with GitHub</a>
		</main>
	</body>
</html>
