<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Your sessions</title>
		<link rel="stylesheet" href="/glass.css" />
		<style>
			#rooms {
				max-width: 40rem;
				margin: 0 auto;
				padding: calc(var(--topbar-height) + 1.5rem) 1rem 2rem;
			}
			.room {
				display: block;
				padding: 1rem;
				margin-bottom: 0.75rem;
				border: 1px solid var(--border);
				border-radius: var(--radius-card);
				color: inherit;
				text-decoration: none;
				transition: background 160ms var(--ease-emphasis);
			}
			.room:active {
				background: var(--surface-raised);
			}
			.room .cwd {
				color: var(--text-muted);
				font-size: 0.8125rem;
				font-family: ui-monospace, Menlo, Consolas, monospace;
			}
			.room .live {
				color: var(--accent);
				font-size: 0.75rem;
			}
			.empty {
				color: var(--text-muted);
				text-align: center;
				padding: 4rem 0;
			}
		</style>
	</head>
	<body>
		<header class="glass topbar"><span>Your sessions</span><a class="pill" href="/logout">Sign out</a></header>
		<main id="rooms"></main>
		<script type="module" src="/rooms.js"></script>
	</body>
</html>
